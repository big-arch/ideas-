[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garage-radar"
version = "0.1.0"
description = "Telegram real estate and car listing analyst for Rostov region"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.15.1,<3"]

[project.scripts]
garage-radar = "garage_radar.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["garage_radar*"]

[tool.setuptools.package-data]
garage_radar = ["ui.html", "ui.css", "ui.js", "ui-workspace.js", "ui-chat.js"]
